<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>بدون اتصال | تماس مارکت</title>
    <meta name="theme-color" content="#08798f" />
    <style>
      :root { --accent: #08798f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: Vazirmatn, "Segoe UI", Tahoma, sans-serif;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f7;
        color: #0f172a;
        text-align: center;
        padding: 24px;
      }
      .card { background: #fff; border-radius: 20px; padding: 40px 28px; max-width: 340px; box-shadow: 0 10px 40px rgba(0,0,0,.06); }
      .dot { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 50%; background: #e0f2f6; display: flex; align-items: center; justify-content: center; }
      .dot svg { width: 28px; height: 28px; stroke: var(--accent); }
      h1 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
      p { font-size: 13.5px; color: #64748b; line-height: 1.7; margin-bottom: 22px; }
      a { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; padding: 11px 28px; border-radius: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
          <line x1="12" y1="2" x2="12" y2="12" />
        </svg>
      </div>
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>برای دسترسی به فروشگاه به یک اتصال فعال نیاز دارید. لطفاً اتصال خود را بررسی کنید و دوباره تلاش کنید.</p>
      <a href="/">تلاش دوباره</a>
    </div>
  </body>
</html>
