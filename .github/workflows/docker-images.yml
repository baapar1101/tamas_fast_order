name: Docker images

# Builds the API and web images and pushes them to GitHub Container Registry,
# for hosts that deploy prebuilt images (Hamravesh compose import, any VPS):
#   ghcr.io/<owner>/tamas-api:<branch>  and  ghcr.io/<owner>/tamas-web:<branch>
# (e.g. :dev), plus a tag per commit SHA.
on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'payment/**'
      - 'docker/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tamas-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.repo }}:${{ github.ref_name }}
            ${{ steps.name.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
