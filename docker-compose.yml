# Tamas Market: the whole site on any server with Docker.
#
#   cp docker/app.env.example docker/app.env   # then fill it in
#   docker compose up -d --build
#
# Open http://SERVER:8080. Another port: WEB_PORT=80 docker compose up -d
# (or put WEB_PORT=80 in a .env file next to this one).
# For Hamravesh see docker-compose.hamravesh.yml and docker/README.md.

name: tamas

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: docker/app.env
    environment:
      POSTGRES_DB: tamas
      POSTGRES_USER: tamas
      # POSTGRES_PASSWORD comes from docker/app.env.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamas -d tamas"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published: only the API reaches the database.

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: tamas-api:latest
    restart: unless-stopped
    env_file: docker/app.env
    environment:
      PORT: "3001"
      TRUST_PROXY: "true"
    volumes:
      # Uploads, private files and in-app backups.
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    # Not published: the web container forwards /api and /uploads to it.

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: tamas-web:latest
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:3001
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./mobile/releases:/usr/share/nginx/apk:ro
    depends_on:
      api:
        condition: service_healthy
        # nginx keeps the API's address from start-up; restart it with the API.
        restart: true

volumes:
  pgdata:
  appdata:
