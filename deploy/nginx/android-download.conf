# Include inside tamasmarket.com's server block through aaPanel's extension directory.
# Release payload is outside Vite dist and Git so subsequent web builds cannot erase it.
location = /downloads/tamas-market-1.0.1.apk {
    alias /www/wwwroot/tamas_fast_order/mobile/releases/tamas-market-1.0.1.apk;
    types { }
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="tamas-market-1.0.1.apk"' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, max-age=86400, immutable";
}

# Preserve previous immutable releases for existing download links.
location = /downloads/tamas-market-1.0.0.apk {
    alias /www/wwwroot/tamas_fast_order/mobile/releases/tamas-market-1.0.0.apk;
    types { }
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="tamas-market-1.0.0.apk"' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, max-age=86400, immutable";
}
