<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>List rail — tamasmarket UI kit</title>
<link rel="stylesheet" href="../../../colors_and_type.css" />
<style>
  body { background: var(--tamas-bg); color: var(--tamas-fg); font-family: var(--tamas-font); margin: 0; padding: 24px; }
  .tk-rail { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .tk-item { display: flex; gap: 12px; align-items: center; background: var(--tamas-surface); border: var(--tamas-border-w) solid var(--tamas-border); border-radius: 14px; padding: 8px 10px; }
  .tk-item img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #f1f1f3; }
  .tk-item b { font-size: 12.5px; font-weight: 700; }
  .tk-item span { font-size: 11px; color: var(--tamas-muted); display: block; }
  .tk-item .px { margin-inline-start: auto; font-weight: 700; font-size: 12.5px; }
  .ltr { unicode-bidi: isolate; direction: ltr; }
</style>
</head>
<body>
  <div class="tk-rail">
    <div class="tk-item">
      <img src="../../../imagery/products/catalog/borofone-cable-01.jpg" alt="" />
      <div><b>کابل BOROFONE <span class="ltr">BX93 USB-C</span></b><span>قیمت فروش</span></div>
      <div class="px">۱۳۵</div>
    </div>
    <div class="tk-item">
      <img src="../../../imagery/products/catalog/borofone-holder-01.jpg" alt="" />
      <div><b>هولدر BOROFONE <span class="ltr">BH54</span></b><span>قیمت فروش</span></div>
      <div class="px">۶۹۹</div>
    </div>
    <div class="tk-item">
      <img src="../../../imagery/products/catalog/borofone-speaker-01.jpg" alt="" />
      <div><b>اسپیکر BOROFONE <span class="ltr">BR29</span></b><span>قیمت فروش</span></div>
      <div class="px">۱٬۶۷۰</div>
    </div>
  </div>
</body>
</html>
