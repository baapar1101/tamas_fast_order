<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Navigation / Sidebar — tamasmarket UI kit</title>
<link rel="stylesheet" href="../../../colors_and_type.css" />
<style>
  body { background: var(--tamas-bg); color: var(--tamas-fg); font-family: var(--tamas-font); margin: 0; padding: 24px; }
  .tk-nav { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .tk-chip { font-size: 12.5px; font-weight: 700; border-radius: var(--tamas-radius-pill); border: var(--tamas-border-w) solid var(--tamas-border); padding: 8px 16px; color: var(--tamas-muted); background: var(--tamas-surface); }
  .tk-chip.on { background: var(--tamas-accent); color: #fff; border-color: var(--tamas-accent); }
</style>
</head>
<body>
  <nav class="tk-nav" aria-label="ثبت‌نوشت سمت راست">
    <span class="tk-chip on">کابل</span>
    <span class="tk-chip">پاوربانک</span>
    <span class="tk-chip">اسپیکر</span>
    <span class="tk-chip">هدفون</span>
    <span class="tk-chip">هولدر</span>
    <span class="tk-chip">ماوس/کیبورد</span>
    <span class="tk-chip">شارژر</span>
  </nav>
</body>
</html>
