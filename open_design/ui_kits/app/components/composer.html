<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Input bar / Composer — tamasmarket UI kit</title>
<link rel="stylesheet" href="../../../colors_and_type.css" />
<style>
  body { background: var(--tamas-bg); color: var(--tamas-fg); font-family: var(--tamas-font); margin: 0; padding: 24px; }
  .tk-composer { max-width: 460px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  .tk-input { flex: 1; border-radius: var(--tamas-radius-pill); border: var(--tamas-border-w) solid var(--tamas-border); padding: 10px 16px; font-family: var(--tamas-font); font-size: 12.5px; background: var(--tamas-surface); color: var(--tamas-fg); }
  .tk-input:focus-visible { outline: 2px solid var(--tamas-accent); outline-offset: 1px; }
  .tk-add { border: 0; border-radius: var(--tamas-radius-pill); background: var(--tamas-accent); color: #fff; font-family: var(--tamas-font); font-weight: 700; font-size: 11.5px; padding: 10px 18px; cursor: pointer; transition: all var(--tamas-duration) var(--tamas-ease); }
  .tk-add:hover { filter: brightness(1.08); }
  .tk-add:active { transform: scale(0.95); }
</style>
</head>
<body>
  <div class="tk-composer">
    <input class="tk-input" placeholder="کد یا نام کالا را جستجو کن… (مثلاً BX93)" aria-label="جستجوی کالا" />
    <button class="tk-add" type="button">افزودن به سفارش</button>
  </div>
</body>
</html>
