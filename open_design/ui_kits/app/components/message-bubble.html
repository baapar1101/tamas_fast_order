<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Message bubble — tamasmarket UI kit</title>
<link rel="stylesheet" href="../../../colors_and_type.css" />
<style>
  body { background: var(--tamas-bg); color: var(--tamas-fg); font-family: var(--tamas-font); margin: 0; padding: 24px; }
  .tk-col { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .tk-bbl { font-size: 12.5px; line-height: 1.6; border-radius: 14px; padding: 10px 14px; max-width: 82%; }
  .tk-bbl.in { background: var(--tamas-accent); color: #fff; align-self: flex-end; }
  .tk-bbl.out { background: color-mix(in srgb, var(--tamas-surface) 82%, transparent); border: var(--tamas-border-w) solid var(--tamas-border); align-self: flex-start; }
  .tk-bbl .st { display: inline-block; font-size: 10.5px; font-weight: 700; border-radius: var(--tamas-radius-pill); padding: 2px 10px; margin-inline-start: 6px; }
  .tk-bbl .st.ok { background: var(--tamas-success-bg); color: var(--tamas-success); }
  .ltr { unicode-bidi: isolate; direction: ltr; }
</style>
</head>
<body>
  <div class="tk-col">
    <div class="tk-bbl in">سفارش ثبت شد — کد <span class="ltr">#BX93</span> <span class="st ok">تأیید شد</span></div>
    <div class="tk-bbl out">پرداخت نهایی در مرحلهٔ ارسال از تهران انجام می‌شود.</div>
    <div class="tk-bbl in"><span class="ltr">BR29</span> اسپیکر نیز موجود است؟</div>
  </div>
</body>
</html>
